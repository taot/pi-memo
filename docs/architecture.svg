<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 726" width="1120" height="726" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1120" height="726" fill="#fbfbf9"/>

  <text x="32" y="38" font-size="19" font-weight="600" fill="#1f2328">pi-mneme 架构</text>
  <text x="32" y="60" font-size="12.5" fill="#57606a">写入与读取都由模型显式发起；扩展只负责让它知道有什么可查，并守住 600 token 的常驻预算。</text>

  <!-- ============ column frames ============ -->
  <rect x="32" y="96" width="252" height="520" rx="8" fill="#ffffff" stroke="#e4e2dc"/>
  <rect x="320" y="96" width="392" height="520" rx="8" fill="#ffffff" stroke="#e4e2dc"/>
  <rect x="748" y="96" width="340" height="520" rx="8" fill="#ffffff" stroke="#e4e2dc"/>

  <text x="32" y="86" font-size="12" font-weight="600" fill="#2563eb" letter-spacing="0.6">pi 会话生命周期</text>
  <text x="320" y="86" font-size="12" font-weight="600" fill="#b45309" letter-spacing="0.6">pi-mneme 扩展（进程内 TS）</text>
  <text x="748" y="86" font-size="12" font-weight="600" fill="#15803d" letter-spacing="0.6">存储 · markdown · 可 git</text>

  <!-- ============ column A ============ -->
  <rect x="48" y="116" width="220" height="56" rx="6" fill="#f5f8ff" stroke="#c7d7f5"/>
  <text x="62" y="139" font-size="13.5" font-weight="600" fill="#1f2328">session_start</text>
  <text x="62" y="158" font-size="11.5" fill="#57606a">启动 · resume · fork</text>

  <rect x="48" y="192" width="220" height="56" rx="6" fill="#f5f8ff" stroke="#c7d7f5"/>
  <text x="62" y="215" font-size="13.5" font-weight="600" fill="#1f2328">context</text>
  <text x="62" y="234" font-size="11.5" fill="#57606a">每次 provider 请求前</text>

  <rect x="48" y="268" width="220" height="140" rx="6" fill="#f5f8ff" stroke="#c7d7f5"/>
  <text x="62" y="291" font-size="13.5" font-weight="600" fill="#1f2328">LLM 显式工具调用</text>
  <text x="62" y="314" font-size="11.5" fill="#57606a">看着索引决定要不要查</text>
  <text x="62" y="337" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">memory_recall</text>
  <text x="62" y="356" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">memory_write</text>
  <text x="62" y="375" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">memory_revise</text>
  <text x="62" y="394" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">memory_forget</text>

  <rect x="48" y="428" width="220" height="56" rx="6" fill="#f5f8ff" stroke="#c7d7f5"/>
  <text x="62" y="451" font-size="13.5" font-weight="600" fill="#1f2328">agent_settled</text>
  <text x="62" y="470" font-size="11.5" fill="#57606a">本轮空闲</text>

  <rect x="48" y="508" width="220" height="60" rx="6" fill="#f7f5ff" stroke="#d5cdf0"/>
  <text x="62" y="531" font-size="13.5" font-weight="600" fill="#1f2328">/mneme-gc  /mneme-stats</text>
  <text x="62" y="550" font-size="11.5" fill="#57606a">只由你手动触发</text>

  <!-- ============ column B ============ -->
  <rect x="336" y="116" width="360" height="132" rx="6" fill="#fffaf3" stroke="#f0d9b5"/>
  <text x="352" y="139" font-size="13.5" font-weight="600" fill="#1f2328">索引注入器</text>
  <text x="352" y="162" font-size="11.5" fill="#57606a">扫描 L1 + L2，按源哈希校验缓存</text>
  <text x="352" y="183" font-size="11.5" fill="#57606a">session 启动时加载一次，保留固定快照</text>
  <text x="352" y="204" font-size="11.5" fill="#57606a">放在消息最前面，session 内不刷新</text>
  <rect x="352" y="215" width="240" height="21" rx="4" fill="#fdf0dd"/>
  <text x="362" y="230" font-size="11.5" font-weight="600" fill="#8a4b08">硬预算 ≤600 token，超出即截断</text>

  <rect x="336" y="268" width="360" height="140" rx="6" fill="#fffaf3" stroke="#f0d9b5"/>
  <text x="352" y="291" font-size="13.5" font-weight="600" fill="#1f2328">工具层</text>
  <text x="352" y="314" font-size="11.5" fill="#57606a">recall — 打分召回，返回全文，hits + 1</text>
  <text x="352" y="335" font-size="11.5" fill="#57606a">write &#160;— 先查重，命中则劝你改用 revise</text>
  <text x="352" y="356" font-size="11.5" fill="#57606a">revise — 旧条转 superseded，新条 supersedes</text>
  <text x="352" y="377" font-size="11.5" fill="#57606a">forget — 转 archived，移出索引，不删文件</text>
  <text x="352" y="398" font-size="11.5" fill="#8a4b08">打分：bm25 × kind × scope × recency × hits</text>

  <rect x="336" y="428" width="360" height="56" rx="6" fill="#fffaf3" stroke="#f0d9b5"/>
  <text x="352" y="451" font-size="13.5" font-weight="600" fill="#1f2328">记账</text>
  <text x="352" y="470" font-size="11.5" fill="#57606a">hits / last_hit 批量写回 frontmatter，不做任何蒸馏</text>

  <rect x="336" y="508" width="360" height="60" rx="6" fill="#faf8ff" stroke="#ddd6f3"/>
  <text x="352" y="531" font-size="13.5" font-weight="600" fill="#1f2328">GC 与统计</text>
  <text x="352" y="550" font-size="11.5" fill="#57606a">生成报告，不逐条提问 → 重建 MEMORY.md 与 .cache/</text>

  <!-- ============ column C ============ -->
  <rect x="764" y="116" width="308" height="142" rx="6" fill="#f5fbf6" stroke="#c2e3cb"/>
  <text x="780" y="139" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">~/.pi/mneme/</text>
  <text x="780" y="158" font-size="11.5" fill="#57606a">L1 全局 · 跟着你走，永不进 repo</text>
  <text x="780" y="181" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">user/*.md</text>
  <text x="880" y="181" font-size="11.5" fill="#57606a">偏好与承诺</text>
  <text x="780" y="201" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">env/*.md</text>
  <text x="880" y="201" font-size="11.5" fill="#57606a">语言 · 库 · 平台的事实</text>
  <text x="780" y="221" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">exp/*.md</text>
  <text x="880" y="221" font-size="11.5" fill="#57606a">跨项目经验</text>
  <text x="780" y="241" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">MEMORY.md</text>
  <text x="880" y="241" font-size="11.5" fill="#57606a">索引，自动生成</text>

  <rect x="764" y="272" width="308" height="142" rx="6" fill="#f5fbf6" stroke="#c2e3cb"/>
  <text x="780" y="295" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">&lt;repo&gt;/.pi/mneme/</text>
  <text x="780" y="314" font-size="11.5" fill="#57606a">L2 项目 · 随 repo 进 git，可分享</text>
  <text x="780" y="337" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">env/*.md</text>
  <text x="880" y="337" font-size="11.5" fill="#57606a">架构 · 约定 · 环境怪癖</text>
  <text x="780" y="357" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">exp/*.md</text>
  <text x="880" y="357" font-size="11.5" fill="#57606a">本项目踩坑与结论</text>
  <text x="780" y="377" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">MEMORY.md</text>
  <text x="880" y="377" font-size="11.5" fill="#57606a">索引，自动生成</text>
  <text x="780" y="397" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">.cache/</text>
  <text x="880" y="397" font-size="11.5" fill="#57606a">倒排索引 + source_hash</text>

  <rect x="764" y="428" width="308" height="96" rx="6" fill="#f5fbf6" stroke="#c2e3cb"/>
  <text x="780" y="451" font-size="13.5" font-weight="600" fill="#1f2328">一文件 = 一条记忆 = 一个结论</text>
  <text x="780" y="473" font-size="11.5" fill="#57606a">frontmatter: id · kind · title · hits · last_hit</text>
  <text x="780" y="494" font-size="11.5" fill="#57606a">正文 ~200 字；exp 必须写"下次怎么办"</text>
  <text x="780" y="515" font-size="11.5" fill="#57606a">正文内 [[id]] 是软链接，指向空 id 也合法</text>

  <rect x="764" y="536" width="308" height="40" rx="6" fill="#eef7f0" stroke="#c2e3cb"/>
  <text x="780" y="553" font-size="11.5" font-weight="600" fill="#1f2328">状态机（永不删文件）</text>
  <text x="780" y="569" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#15803d">status: active ↔ archived</text>

  <!-- ============ arrows A -> B ============ -->
  <line x1="268" y1="144" x2="330" y2="150" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="272" y="137" font-size="10.5" fill="#57606a">加载快照</text>

  <line x1="268" y1="220" x2="330" y2="200" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="272" y="238" font-size="10.5" fill="#57606a">前置索引块</text>

  <line x1="268" y1="338" x2="330" y2="338" stroke="#57606a" stroke-width="1.3" marker-start="url(#arS)" marker-end="url(#ar)"/>
  <text x="272" y="331" font-size="10.5" fill="#57606a">调用 / 结果</text>

  <line x1="268" y1="456" x2="330" y2="456" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="268" y1="538" x2="330" y2="538" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- ============ arrows B <-> C ============ -->
  <line x1="758" y1="170" x2="702" y2="170" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="706" y="163" font-size="10.5" fill="#57606a">读两层索引</text>

  <line x1="702" y1="330" x2="758" y2="330" stroke="#57606a" stroke-width="1.3" marker-start="url(#arS)" marker-end="url(#ar)"/>
  <text x="706" y="337" font-size="10.5" fill="#57606a">读 / 写</text>

  <line x1="702" y1="456" x2="758" y2="408" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="706" y="472" font-size="10.5" fill="#57606a">回写计数</text>

  <line x1="702" y1="538" x2="758" y2="552" stroke="#57606a" stroke-width="1.3" marker-start="url(#arS)" marker-end="url(#ar)"/>

  <!-- ============ legend band ============ -->
  <rect x="32" y="640" width="1056" height="62" rx="8" fill="#f4f4f0" stroke="#e4e2dc"/>
  <text x="48" y="662" font-size="11.5" font-weight="600" fill="#57606a" letter-spacing="0.5">对应论文 (Hu et al. 2026) 的三个算子</text>

  <text x="48" y="686" font-size="12" font-weight="600" fill="#1f2328">Formation §5.1</text>
  <text x="168" y="686" font-size="11.5" fill="#57606a">knowledge distillation，由模型显式 write</text>

  <text x="452" y="686" font-size="12" font-weight="600" fill="#1f2328">Evolution §5.2</text>
  <text x="568" y="686" font-size="11.5" fill="#57606a">软失效 + 手动 GC，不做破坏性覆盖</text>

  <text x="838" y="686" font-size="12" font-weight="600" fill="#1f2328">Retrieval §5.3</text>
  <text x="954" y="686" font-size="11.5" fill="#57606a">session 快照 + 显式 recall</text>
</svg>
